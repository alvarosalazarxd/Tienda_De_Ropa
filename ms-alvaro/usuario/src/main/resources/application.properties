
spring.application.name=usuario
server.port=8081

# =====================================
# CONEXIÓN A LA BASE DE DATOS
# =====================================

spring.datasource.url=jdbc:mysql://localhost:3306/db_usuario?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# CONFIGURACIÓN JPA / HIBERNATE
# =====================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dialecto para MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Mostrar SQL ordenado
spring.jpa.properties.hibernate.format_sql=true
