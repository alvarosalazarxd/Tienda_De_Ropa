<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Moda & Estilo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">


    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Moda & Estilo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">Productos</a>
                    </li>
                </ul>


                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link position-relative active" href="carrito.html">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span id="contadorCarrito" class="badge rounded-pill bg-warning text-dark position-absolute top-0 start-100 translate-middle" style="font-size:0.65rem;">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar Sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registrarse</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <header class="p-4 bg-dark text-white text-center">
        <h1><i class="bi bi-cart3 me-2"></i>Tu Carrito de Compras</h1>
    </header>


    <main class="container my-5 flex-grow-1">
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-secondary">
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="listaCarrito">
                            <!-- Las filas se generan dinámicamente con main.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mt-4 gap-3">
            <button type="button" id="btnVaciarCarrito" class="btn btn-outline-danger">
                <i class="bi bi-trash me-1"></i>Vaciar Carrito
            </button>

            <div class="text-center text-md-end">
                <h4 class="fw-bold mb-2">Total: <span id="totalCarrito" class="text-primary">$0</span></h4>
                <button type="button" id="btnPagar" class="btn btn-warning btn-lg fw-bold">
                    <i class="bi bi-credit-card me-2"></i>Proceder al Pago
                </button>
            </div>
        </div>

        <div class="mt-4">
            <a href="productos.html" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Seguir Comprando
            </a>
        </div>
    </main>


    <footer class="bg-dark text-light pt-4 pb-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-white-50">&copy; 2026 Moda & Estilo. Todos los derechos reservados.</p>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
