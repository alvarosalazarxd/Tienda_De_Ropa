spring.application.name=carrito
server.port=8084

# Conexion a MySQL en XAMPP para Carrito
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_carrito?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optimizacion de hilos y conexiones para correr los 4 microservicios fluidos
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
spring.jmx.enabled=false
