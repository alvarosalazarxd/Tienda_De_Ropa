spring.application.name=gateway
server.port=8080

# Rutas hacia los microservicios internos
gateway.services.usuario-url=http://localhost:8081
gateway.services.pedido-url=http://localhost:8083
gateway.services.carrito-url=http://localhost:8084
gateway.services.producto-url=http://localhost:8085

# Optimizacion de arranque y consumo de memoria en local
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.jmx.enabled=false
