<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago - Moda & Estilo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row g-4">
            
            <div class="col-lg-7">
                <form id="formCheckout">
                    
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2 text-primary"></i>1. Datos de Despacho</h5>
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label small text-muted">Nombre</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label small text-muted">Apellido</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small text-muted">Correo Electrónico</label>
                                    <input type="email" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small text-muted">Dirección de Entrega</label>
                                    <input type="text" class="form-control" placeholder="Av. Principal 123, Depto 45" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-credit-card me-2 text-primary"></i>2. Método de Pago</h5>
                            
                            <div class="form-check p-3 border rounded mb-2">
                                <input class="form-check-input" type="radio" name="metodoPago" id="tarjeta" value="tarjeta" checked>
                                <label class="form-check-label w-100 fw-bold ms-2" for="tarjeta">
                                    Tarjeta de Débito / Crédito (Webpay)
                                </label>
                            </div>

                            <div id="camposTarjeta" class="mt-3 p-3 bg-light rounded border">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label for="numeroTarjeta" class="form-label small text-muted">Número de Tarjeta</label>
                                        <input type="text" id="numeroTarjeta" class="form-control" placeholder="1234 5678 9012 3456" maxlength="19" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="expiracionTarjeta" class="form-label small text-muted">Expiración</label>
                                        <input type="text" id="expiracionTarjeta" class="form-control" placeholder="MM/AA" maxlength="5" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="cvvTarjeta" class="form-label small text-muted">CVV</label>
                                        <input type="password" id="cvvTarjeta" class="form-control" placeholder="123" maxlength="3" required>
                                    </div>
                                </div>
                            </div>

                            <div class="form-check p-3 border rounded mt-2">
                                <input class="form-check-input" type="radio" name="metodoPago" id="transferencia" value="transferencia">
                                <label class="form-check-label w-100 fw-bold ms-2" for="transferencia">
                                    Transferencia Bancaria Directa
                                </label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg w-100 py-3 fw-bold">
                        <i class="bi bi-lock-fill me-2"></i>CONFIRMAR Y PAGAR
                    </button>
                </form>
            </div>

            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-3">RESUMEN DEL PEDIDO</h5>
                    <div id="itemsCheckout" class="mb-3"></div>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Envío</span>
                        <span class="text-success fw-bold">Gratis</span>
                    </div>
                    <div class="d-flex justify-content-between fs-4 fw-bold">
                        <span>Total</span>
                        <span id="totalPago">$0</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioTarjeta = document.getElementById('tarjeta');
            const radioTransferencia = document.getElementById('transferencia');
            const camposTarjeta = document.getElementById('camposTarjeta');

            if (radioTarjeta && radioTransferencia && camposTarjeta) {
                const inputsTarjeta = camposTarjeta.querySelectorAll('input');
                
                function toggleTarjeta() {
                    if (radioTarjeta.checked) {
                        camposTarjeta.style.display = 'block';
                        inputsTarjeta.forEach(i => i.required = true);
                    } else {
                        camposTarjeta.style.display = 'none';
                        inputsTarjeta.forEach(i => i.required = false);
                    }
                }

                radioTarjeta.addEventListener('change', toggleTarjeta);
                radioTransferencia.addEventListener('change', toggleTarjeta);
            }

            const inputNumero = document.getElementById('numeroTarjeta');
            const inputExp = document.getElementById('expiracionTarjeta');
            const inputCvv = document.getElementById('cvvTarjeta');

            if (inputNumero) {
                inputNumero.addEventListener('input', (e) => {
                    let valor = e.target.value.replace(/\D/g, '').substring(0, 16);
                    let bloques = valor.match(/.{1,4}/g);
                    e.target.value = bloques ? bloques.join(' ') : '';
                });
            }

            if (inputExp) {
                inputExp.addEventListener('input', (e) => {
                    let valor = e.target.value.replace(/\D/g, '').substring(0, 4);
                    if (valor.length >= 3) {
                        e.target.value = valor.substring(0, 2) + '/' + valor.substring(2, 4);
                    } else {
                        e.target.value = valor;
                    }
                });
            }

            if (inputCvv) {
                inputCvv.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/\D/g, '').substring(0, 3);
                });
            }

            if (typeof inicializarCheckout === 'function') {
                inicializarCheckout();
            }
        });
    </script>
</body>
</html>
