<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar compra - Moda & Estilo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                Moda & Estilo
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">
                            Nosotros
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- CHECKOUT -->
    <main class="container py-5">

        <h1 class="mb-4">
            <i class="bi bi-credit-card"></i>
            Finalizar compra
        </h1>

        <div class="row g-4">

            <!-- DATOS DEL CLIENTE -->
            <div class="col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-header">
                        <h5 class="mb-0">
                            Datos de envío
                        </h5>
                    </div>

                    <div class="card-body">

                        <form id="formCheckout">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="nombre" class="form-label">
                                        Nombre
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="nombre"
                                        required
                                    >

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="apellido" class="form-label">
                                        Apellido
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="apellido"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label for="telefono" class="form-label">
                                    Teléfono
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="telefono"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label for="direccion" class="form-label">
                                    Dirección
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="direccion"
                                    placeholder="Ej: Av. Principal 123"
                                    required
                                >

                            </div>


                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="comuna" class="form-label">
                                        Comuna
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="comuna"
                                        required
                                    >

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="region" class="form-label">
                                        Región
                                    </label>

                                    <select
                                        class="form-select"
                                        id="region"
                                        required
                                    >

                                        <option value="">
                                            Seleccionar región
                                        </option>

                                        <option>
                                            Región de Arica y Parinacota
                                        </option>

                                        <option>
                                            Región de Tarapacá
                                        </option>

                                        <option>
                                            Región de Antofagasta
                                        </option>

                                        <option>
                                            Región de Atacama
                                        </option>

                                        <option>
                                            Región de Coquimbo
                                        </option>

                                        <option>
                                            Región de Valparaíso
                                        </option>

                                        <option>
                                            Región Metropolitana
                                        </option>

                                        <option>
                                            Región de O'Higgins
                                        </option>

                                        <option>
                                            Región del Maule
                                        </option>

                                        <option>
                                            Región de Ñuble
                                        </option>

                                        <option>
                                            Región del Biobío
                                        </option>

                                        <option>
                                            Región de La Araucanía
                                        </option>

                                        <option>
                                            Región de Los Ríos
                                        </option>

                                        <option>
                                            Región de Los Lagos
                                        </option>

                                        <option>
                                            Región de Aysén
                                        </option>

                                        <option>
                                            Región de Magallanes
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <hr>


                            <h5 class="mb-3">
                                Método de pago
                            </h5>


                            <div class="form-check mb-2">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="pago"
                                    id="tarjeta"
                                    value="Tarjeta"
                                    required
                                >

                                <label
                                    class="form-check-label"
                                    for="tarjeta"
                                >
                                    <i class="bi bi-credit-card"></i>
                                    Tarjeta de crédito/débito
                                </label>

                            </div>


                            <div class="form-check mb-2">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="pago"
                                    id="transferencia"
                                    value="Transferencia"
                                >

                                <label
                                    class="form-check-label"
                                    for="transferencia"
                                >
                                    <i class="bi bi-bank"></i>
                                    Transferencia bancaria
                                </label>

                            </div>


                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="pago"
                                    id="webpay"
                                    value="Webpay"
                                >

                                <label
                                    class="form-check-label"
                                    for="webpay"
                                >
                                    <i class="bi bi-wallet2"></i>
                                    Webpay
                                </label>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >

                                <i class="bi bi-check-circle"></i>
                                Confirmar pedido

                            </button>

                        </form>

                    </div>

                </div>

            </div>


            <!-- RESUMEN DEL PEDIDO -->
            <div class="col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <h5 class="mb-0">
                            Resumen del pedido
                        </h5>

                    </div>


                    <div class="card-body">

                        <div id="resumenPedido"></div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <strong>
                                Total
                            </strong>

                            <strong id="totalCheckout">
                                $0
                            </strong>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT DEL PROYECTO -->
    <script src="js/main.js"></script>

</body>
</html>
