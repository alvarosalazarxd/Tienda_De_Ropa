<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Detalle del Producto - Moda & Estilo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Moda & Estilo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <!-- ÍCONO DEL CARRITO AGREGADO -->
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="carrito.html">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span id="contadorCarrito" class="badge rounded-pill bg-warning text-dark position-absolute top-0 start-100 translate-middle" style="font-size:0.65rem;">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    
    <main class="container my-5 flex-grow-1">
        
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                <li class="breadcrumb-item"><a href="productos.html">Productos</a></li>
                <li class="breadcrumb-item active" id="breadcrumbNombre" aria-current="page">Cargando...</li>
            </ol>
        </nav>

        <section class="card border-0 shadow-sm p-4">
            <div class="row g-4 align-items-center">
                
                <div class="col-md-6">
                    <img id="prodImg" src="" class="img-fluid rounded shadow-sm w-100" style="max-height: 450px; object-fit: cover;" alt="Producto">
                </div>

                <div class="col-md-6">
                    <span id="prodCategoria" class="badge bg-warning text-dark mb-2">Colección</span>
                    <h1 id="prodNombre" class="fw-bold display-6">Nombre del Producto</h1>
                    <p id="prodRef" class="text-muted fs-5">Ref: #000</p>
                    
                    <h2 id="prodPrecio" class="text-primary fw-bold display-6 my-3">$0</h2>
                    
                    <p id="prodDesc" class="card-text">
                        Descripción del producto.
                    </p>

                    <form class="mt-4">
                        <div class="mb-3">
                            <label for="tallaSelect" class="form-label fw-bold">Seleccionar Talla:</label>
                            <select class="form-select w-50" id="tallaSelect">
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="cantidadInput" class="form-label fw-bold">Cantidad:</label>
                            <input type="number" class="form-control w-25" id="cantidadInput" value="1" min="1" max="10">
                        </div>

                        <div class="d-grid gap-2 d-md-block">
                            <button type="button" id="btnAgregarCarrito" class="btn btn-primary btn-lg px-4 me-md-2 fw-bold">
                                <i class="bi bi-cart-plus me-2"></i>Añadir al Carrito
                            </button>
                            <a href="productos.html" class="btn btn-outline-secondary btn-lg">Volver al Catálogo</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-light pt-4 pb-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-white-50">&copy; 2026 Moda & Estilo. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/main.js"></script>

    
    <script>
        const productos = {
            "1": {
                nombre: "Polera Oversize Negra",
                ref: "Ref: #001",
                precio: "$19.990",
                categoria: "Colección Urbana",
                img: "img/urbana.jpg",
                desc: "Polera de algodón 100% con estilo urbano holgado, ideal para un look cómodo y moderno.",
                tallas: ["S - Small", "M - Medium", "L - Large", "XL - Extra Large"],
                stock: 15
            },
            "2": {
                nombre: "Pantalón Jean Classic",
                ref: "Ref: #002",
                precio: "$29.990",
                categoria: "Colección Casual",
                img: "img/casual.jpg",
                desc: "Jeans de corte recto con material resistente y flexible, perfecto para combinar a diario.",
                tallas: ["38 - S", "40 - M", "42 - L", "44 - XL"],
                stock: 8
            },
            "3": {
                nombre: "Chaqueta Formal Fit",
                ref: "Ref: #003",
                precio: "$45.990",
                categoria: "Colección Formal",
                img: "img/formal.jpg",
                desc: "Chaqueta de diseño elegante para eventos especiales, confeccionada con terminaciones finas.",
                tallas: ["S - Small", "M - Medium", "L - Large"],
                stock: 0
            },
            "4": {
                nombre: "Gorro Beanie Urbano",
                ref: "Ref: #004",
                precio: "$8.990",
                categoria: "Accesorios",
                img: "img/accesorios.jpg",
                desc: "Gorro tejido de lana acrílica, el accesorio perfecto para complementar tu vestimenta.",
                tallas: ["Talla Única (Estandard)"],
                stock: 20
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const prodId = urlParams.get('id') || "1"; 

        const p = productos[prodId] || productos["1"];

        document.getElementById("pageTitle").innerText = `${p.nombre} - Moda & Estilo`;
        document.getElementById("breadcrumbNombre").innerText = p.nombre;
        document.getElementById("prodNombre").innerText = p.nombre;
        document.getElementById("prodRef").innerText = p.ref;
        document.getElementById("prodPrecio").innerText = p.precio;
        document.getElementById("prodCategoria").innerText = p.categoria;
        document.getElementById("prodDesc").innerText = p.desc;
        document.getElementById("prodImg").src = p.img;
        document.getElementById("prodImg").alt = p.nombre;

        const selectTalla = document.getElementById("tallaSelect");
        selectTalla.innerHTML = "";
        p.tallas.forEach((talla, index) => {
            const opt = document.createElement("option");
            opt.value = talla;
            opt.innerText = talla;
            if (p.tallas.length > 1 && index === 1) opt.selected = true;
            selectTalla.appendChild(opt);
        });

        const cantidadInput = document.getElementById("cantidadInput");
        cantidadInput.max = p.stock;

        const btnAgregar = document.getElementById("btnAgregarCarrito");
        const infoStock = document.createElement("p");
        infoStock.className = "text-muted small mb-3";

        if (p.stock > 0) {
            infoStock.textContent = `Quedan ${p.stock} unidades disponibles.`;
        } else {
            infoStock.textContent = "Producto sin stock disponible.";
            infoStock.classList.add("text-danger", "fw-bold");
            btnAgregar.disabled = true;
        }

        cantidadInput.closest(".mb-4").after(infoStock);

        const precioNumero = parseInt(p.precio.replace(/\D/g, ""), 10);

        document.getElementById("btnAgregarCarrito").addEventListener("click", () => {
            const talla = document.getElementById("tallaSelect").value;
            const cantidad = parseInt(document.getElementById("cantidadInput").value, 10) || 1;

            if (!talla) {
                alert("Por favor selecciona una talla.");
                return;
            }

            if (cantidad > p.stock) {
                alert(`Solo quedan ${p.stock} unidades disponibles.`);
                return;
            }

            const carritoActual = obtenerCarrito();
            const yaEnCarrito = carritoActual.find(item => item.id === prodId && item.talla === talla);
            const cantidadTotal = (yaEnCarrito ? yaEnCarrito.cantidad : 0) + cantidad;

            if (cantidadTotal > p.stock) {
                alert(`No puedes agregar más, ya tienes ${yaEnCarrito ? yaEnCarrito.cantidad : 0} en el carrito y solo hay ${p.stock} disponibles.`);
                return;
            }

            agregarAlCarrito({
                id: prodId,
                nombre: p.nombre,
                precio: precioNumero,
                imagen: p.img,
                talla: talla,
                cantidad: cantidad
            });
        });
    </script>
</body>

</html>
